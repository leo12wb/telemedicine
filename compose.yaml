services:

  # ─────────────────────────────────────────────
  # Aplicação PHP-FPM (Laravel)
  # ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telemedicina_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - app_storage:/var/www/html/storage/app
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-telemedicina}
      DB_USERNAME: ${DB_USERNAME:-telemedicina}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@telemedicina.local}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - telemedicina_network

  # ─────────────────────────────────────────────
  # Nginx — proxy reverso
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: telemedicina_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - telemedicina_network

  # ─────────────────────────────────────────────
  # PostgreSQL 16
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: telemedicina_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-telemedicina}
      POSTGRES_USER: ${DB_USERNAME:-telemedicina}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-telemedicina} -d ${DB_DATABASE:-telemedicina}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - telemedicina_network
    # PostgreSQL NÃO é exposto ao host em produção.
    # Para desenvolvimento local, descomente a linha abaixo:
    # ports:
    #   - "5432:5432"

  # ─────────────────────────────────────────────
  # Queue Worker (mesmo Dockerfile do app)
  # ─────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telemedicina_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-telemedicina}
      DB_USERNAME: ${DB_USERNAME:-telemedicina}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@telemedicina.local}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - telemedicina_network

  # ─────────────────────────────────────────────
  # Mailpit — captura de e-mails (apenas dev)
  # ─────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: telemedicina_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"   # Interface web
    networks:
      - telemedicina_network

# ─────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  app_storage:
    driver: local

# ─────────────────────────────────────────────
# Rede interna
# ─────────────────────────────────────────────
networks:
  telemedicina_network:
    driver: bridge
