server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Charset
    charset utf-8;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Tamanho máximo de upload (deve corresponder ao php.ini)
    client_max_body_size 25M;

    # Rota principal — tenta servir arquivo estático, depois diretório, depois passa ao PHP
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Assets estáticos com cache longo
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeouts
        fastcgi_read_timeout 120;
        fastcgi_send_timeout 120;
    }

    # Bloquear acesso a arquivos sensíveis
    location ~ /\.(ht|env|git) {
        deny all;
    }

    # Bloquear acesso direto a arquivos do Laravel que não devem ser públicos
    location ~ ^/(storage|bootstrap|config|database|routes|app|resources|tests|vendor)/ {
        deny all;
    }
}
